# Control/execution-plane split (docs/control_execution_split.md). Five
# distinct installable packages that share Python namespaces (PEP-420) but
# have disjoint dependency closures:
#   packages/core               (aiplatform-core)              — shared: JobRecord, storage, compute
#   packages/api                (aiplatform-api)               — core + fastapi, NO engine
#   packages/worker             (aiplatform-worker)            — core + pydantic_graph (+ per-runtime extras)
#   packages/math-qa            (mathai-math-qa)               — domain, default runtime
#   packages/math-conversation  (mathai-math-conversation)     — domain, crewai runtime
#
# Each service installs standalone with uv from core + the packages it
# needs (api/worker/domain pyprojects pin `aiplatform-core` via a path
# source), so the api image never contains worker code and vice versa —
# true per-image isolation. NOT a uv workspace: a workspace forbids path
# sources for members, which we need for standalone installs. Tests run
# against source via `pythonpath` below (no install needed).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/core/src",
    "packages/api/src",
    "packages/worker/src",
    "packages/math-qa/src",
    "packages/math-conversation/src",
]
