# Control/execution-plane split (docs/control_execution_split.md). Four
# distinct installable packages that share Python namespaces (PEP-420) but
# have disjoint dependency closures:
#   packages/core      (aiplatform-core)     — shared: JobRecord, storage, compute
#   packages/api       (aiplatform-api)      — core + fastapi, NO engine
#   packages/worker    (aiplatform-worker)   — core + pydantic_graph (+ per-runtime extras)
#   packages/_demo     (aiplatform-demo)     — synthetic "hello" domain that ships
#                                              with the platform so local dev / CI
#                                              stays runnable when no real domain
#                                              is deployed yet.
#   packages/cli       (aiplatform-cli)      — standalone, pure-HTTP ops CLI (`aip`);
#                                              imports ZERO platform internals (issue #49).
#
# Each service installs standalone with uv from core + the packages it
# needs. NOT a uv workspace: a workspace forbids path sources for members,
# which we need for standalone installs. Tests run against source via
# `pythonpath` below.
#
# Real domains (math-qa, math-conversation, friend's domains) live in
# their own repos and arrive at runtime via `aiplatform deploy` →
# CodePackage catalog → boot-time `install_*_packages_for_*`. See
# docs/architecture.md and NEXT_BEST_STEPS.md §7q.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/core/src",
    "packages/api/src",
    "packages/worker/src",
    "packages/_demo/src",
    "packages/cli/src",
]
