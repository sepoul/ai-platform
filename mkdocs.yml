site_name: ai-platform
site_description: Architecture, ops, and onboarding docs for the ai-platform control plane and the synthetic _demo baseline. Domain repos (e.g. sepoul/math-app) carry their own docs.
site_url: "https://sepoul.github.io/ai-platform/"
repo_url: "https://github.com/sepoul/ai-platform"
repo_name: "sepoul/ai-platform"
edit_uri: "edit/main/docs/"
# §1n: surface broken intra-doc links + nav issues. Many doc bodies
# still link to source files via `../packages/...` paths which are
# valid on GitHub but unknown to mkdocs — those are warnings we
# tolerate for now. Full strict mode lands once those bodies are
# rewritten to use github absolute URLs (tracked in §1n).
strict: false
validation:
  links:
    absolute_links: warn
    unrecognized_links: warn
    not_found: warn
  nav:
    omitted_files: warn
    not_found: warn
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light
  font:
    text: Inter
    code: JetBrains Mono

# Explicit nav — controls order and avoids autonav surprises.
# `docs/README.md` is the landing page (index).
#
# The "Project" section pulls in `AGENTS.md` / `FEATURES.md` /
# `NEXT_BEST_STEPS.md` from the repo root via symlinks under
# `docs/project/`. They're kept distinct from the Architecture /
# Onboarding sections because they describe *how the team works*
# and *where things are going*, not how the system already works.
nav:
  - Overview: README.md
  - Architecture: architecture.md
  - Concepts:
      - Platform design: concepts/platform-design.md
      - Control / execution split: concepts/control-execution-split.md
      - Jobs: concepts/jobs.md
  - Guides:
      - Deploy a domain: guides/deploy-a-domain.md
      - SDK & types (dev loop): guides/sdk-and-types.md
      - Prompt registry: guides/prompts.md
      - Live logs: guides/live-logs.md
  - Reference:
      - Storage backends: reference/storage-backends.md
      - Compute backends: reference/compute-backends.md
      - Typed clients (OpenAPI / SDK): reference/typed-clients.md
  - Operations:
      - Hetzner single box: operations/hetzner-deploy.md
      - Supabase backend: operations/supabase.md
  - Project:
      - Overview: project/README.md
      - Agent conventions: project/AGENTS.md
      - Backend backlog: project/NEXT_BEST_STEPS.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  # The autogenerated API reference (mkdocstrings + gen-files) was
  # retired with the §7q repo split — gen_ref_pages.py walked `src/`,
  # which no longer exists at the repo root. If you want it back,
  # walk `packages/*/src/<ns>` instead.
