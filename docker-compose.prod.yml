# Production override: pull the three pre-built split images from GHCR
# instead of rebuilding on the box. Merge on top of docker-compose.yml.
#
# Usage on the Hetzner box (or any deploy target):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Pin to a specific build by exporting IMAGE_TAG (defaults to :latest):
#   IMAGE_TAG=sha-abc1234 docker compose -f ... -f ... up -d
#
# Production runs BOTH workers simultaneously (different domains use
# different agentic libraries — pydantic_ai for math_qa, CrewAI for
# math_conversation). `worker-crewai` inherits the `crewai` profile from
# the base file; `redeploy.sh` opts it in by default. The `ui` profile
# brings up math-ui.

services:
  api:
    image: ghcr.io/sepoul/aiplatform-api:${IMAGE_TAG:-latest}

  # Both worker services now run the VIRGIN aiplatform-worker image:
  # zero domain code baked in. Domains arrive at boot via the
  # CodePackage catalog (`POST /code-packages` from `aiplatform deploy`),
  # which the worker pulls + pip-installs before resolving execution
  # entrypoints. `worker` vs `worker-crewai` is purely a runtime-stack
  # split — same image, different WORKER_RUNTIME env, different wheels
  # installed at boot. See docs/architecture.md §4.2.
  worker:
    image: ghcr.io/sepoul/aiplatform-worker:${IMAGE_TAG:-latest}

  worker-crewai:
    image: ghcr.io/sepoul/aiplatform-worker:${IMAGE_TAG:-latest}

  celery-worker:
    image: ghcr.io/sepoul/aiplatform-worker:${IMAGE_TAG:-latest}

  math-ui:
    image: ghcr.io/sepoul/math-ui:${IMAGE_TAG:-latest}
    profiles: [ui]
    environment:
      # BFF routes proxy to the API over the compose network.
      MATH_API_URL: http://api:8000
    ports:
      - "3000:7860"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Platform admin SPA — catalog browser, domain-free. Brought up
  # together with math-ui under the `ui` profile so a single
  # redeploy ships both. Host port 3001 → container 7861.
  platform-ui:
    image: ghcr.io/sepoul/platform-ui:${IMAGE_TAG:-latest}
    profiles: [ui]
    environment:
      # BFF routes proxy to the API over the compose network.
      PLATFORM_API_URL: http://api:8000
    ports:
      - "3001:7861"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
