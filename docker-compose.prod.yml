# Production override: pull pre-built images from GHCR instead of
# rebuilding on the box. Merge on top of docker-compose.yml.
#
# Usage on the Hetzner box (or any deploy target):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Pin to a specific build by exporting IMAGE_TAG (defaults to :latest):
#   IMAGE_TAG=sha-abc1234 docker compose -f ... -f ... up -d
#
# `build:` from the base file is merged in but ignored by `pull` — only
# `image:` is fetched, and `up -d` finds the pulled tag locally.
#
# The math-ui service is gated behind the `ui` compose profile so the
# default `redeploy.sh` keeps shipping just api + worker (current
# Hetzner posture). Bring the UI up with `--profile ui`; see
# `infra/hetzner/scripts/redeploy.sh` and the deploy doc Step 5.

services:
  api:
    image: ghcr.io/sepoul/mathapp:${IMAGE_TAG:-latest}

  worker:
    image: ghcr.io/sepoul/mathapp:${IMAGE_TAG:-latest}

  celery-worker:
    image: ghcr.io/sepoul/mathapp:${IMAGE_TAG:-latest}

  math-ui:
    image: ghcr.io/sepoul/math-ui:${IMAGE_TAG:-latest}
    profiles: [ui]
    environment:
      # BFF routes proxy to the API over the compose network.
      MATH_API_URL: http://api:8000
    ports:
      - "3000:7860"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
