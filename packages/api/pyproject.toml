[project]
name = "aiplatform-api"
version = "0.1.0"
description = "Control plane (API): job creation, exploration, artifact lookup. Depends on core + FastAPI; engine-free. Domain control modules arrive at runtime via the CodePackage catalog, not as build-time deps."
requires-python = ">=3.13"
dependencies = [
    "aiplatform-core",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-multipart",
    # Domain packages are NOT pinned here. The platform/domain split
    # is now realized: each domain's wheel arrives via the CodePackage
    # catalog (`aiplatform deploy`), and the API's boot-time install
    # pass (`install_control_packages_for_api`) pip-installs the
    # control modules before `register_control_domains` imports them.
    # See docs/architecture.md §6.
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.uv.sources]
# Path (not workspace) so the api image installs standalone from core.
# No domain sources here — they're catalog-delivered at boot.
aiplatform-core = { path = "../core", editable = true }
