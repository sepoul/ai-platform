[project]
name = "aiplatform-worker"
version = "0.1.0"
description = "Execution plane (worker): virgin runtime. Ships only pydantic_graph (the platform graph framework all runtimes need). Real domains arrive at boot via the CodePackage catalog (`aiplatform deploy` → `install_packages_for_runtime`); the worker base is identical for every runtime."
requires-python = ">=3.13"
dependencies = [
    "aiplatform-core",
    "python-dotenv",
    # The platform graph framework — both runtimes need it (job_runner imports
    # `End` from pydantic_graph). Direct dep so the worker base resolves
    # without depending on which runtime extra is picked.
    "pydantic-graph>=1.58.0",
    # OpenAI SDK — a *framework-neutral* platform capability, present in BOTH
    # runtimes (it lives in the shared virgin worker base, like pydantic-graph,
    # not in a runtime-specific extra and not pulled by domain wheels). It has
    # no `opentelemetry` dependency, so it does NOT reintroduce the otel-sdk
    # pin conflict that keeps `default` (Logfire >=1.39) and `crewai` (<1.35)
    # apart — safe to share. Powers `ai_platform.ai.providers.audio`
    # (transcription, usable under either framework) and, with the default
    # runtime's pydantic_ai, `openai_agent`.
    "openai>=1.55",
]

[project.optional-dependencies]
# `demo` extra: synthetic platform-only domain. Bundled into the worker
# image as the cold-boot baseline so `docker compose up` and CI work
# without a real domain deployed. Real domains (math-app, friends')
# layer in at runtime via the CodePackage catalog.
demo = ["aiplatform-demo[execution]"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.uv.sources]
aiplatform-core = { path = "../core", editable = true }
aiplatform-demo = { path = "../_demo", editable = true }
