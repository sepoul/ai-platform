[project]
name = "mathapp-execution-plane"
version = "0.1.0"
description = "Execution plane (worker): virgin runtime. The base ships only pydantic_graph (the platform graph framework all runtimes need). Each runtime extra pulls a domain package, which in turn pulls its own LLM stack. The two extras are mutually exclusive over the otel-sdk pin — each runs as its own worker image, so no shared interpreter, no shared SDK pins."
requires-python = ">=3.13"
dependencies = [
    "mathapp-core",
    "python-dotenv",
    # The platform graph framework — both runtimes need it (job_runner imports
    # `End` from pydantic_graph). Direct dep so the worker base resolves
    # without depending on which runtime extra is picked.
    "pydantic-graph>=1.58.0",
]

[project.optional-dependencies]
# default runtime: math_qa domain + its execution-side LLM stack (pydantic_ai
# + Anthropic + Logfire, otel >=1.39). Image:
# `Dockerfile.worker --build-arg EXTRA=default`.
default = ["mathai-math-qa[execution]"]
# crewai runtime: math_conversation domain + its execution-side LLM stack
# (CrewAI[anthropic], otel <1.35; no Logfire). Image:
# `Dockerfile.worker --build-arg EXTRA=crewai`.
crewai = ["mathai-math-conversation[execution]"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.uv.sources]
# Path (not workspace) so the worker image installs from just core + the
# domain package it serves. mathapp-core is always pulled; the domain
# pkgs are pulled only by the extras above.
mathapp-core = { path = "../core", editable = true }
mathai-math-qa = { path = "../math-qa", editable = true }
mathai-math-conversation = { path = "../math-conversation", editable = true }
