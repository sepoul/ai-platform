[project]
name = "mathapp-core"
version = "0.1.0"
description = "Shared platform: the JobRecord boundary, storage + compute backends, job types, and domain schemas. No web framework, no AI engine."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.5",
    "python-dotenv",
    "httpx>=0.28.0",
    "pyyaml",
    # storage backends
    "b2sdk",
    "psycopg[binary,pool]>=3.2",
    # compute backend (shared: API enqueues, worker executes)
    "celery[redis]>=5.4",
    # domain figure / document tooling (not the AI engine)
    "graphviz>=0.21",
    "openpyxl>=3.1.3",
    "reportlab>=4.4.7,<5",
    "python-docx",
    "pymupdf",
    "streamlit-agraph",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
