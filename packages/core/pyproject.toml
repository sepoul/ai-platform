[project]
name = "aiplatform-core"
version = "0.1.2"
description = "Shared platform: the JobRecord boundary, storage + compute backends, job types, and domain schemas. No web framework, no AI engine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]
dependencies = [
    "pydantic>=2.12.5",
    "python-dotenv",
    "httpx>=0.28.0",
    "pyyaml",
    # storage backends
    "b2sdk",
    "psycopg[binary,pool]>=3.2",
    # compute backend (shared: API enqueues, worker executes)
    "celery[redis]>=5.4",
    # domain figure / document tooling (not the AI engine)
    "graphviz>=0.21",
    "openpyxl>=3.1.3",
    "reportlab>=4.4.7,<5",
    "python-docx",
    "pymupdf",
    "streamlit-agraph",
]

[project.scripts]
# `aiplatform deploy` — manifest-driven bundle deploy. Friend's repo
# installs `aiplatform-core` and gets this CLI on PATH.
aiplatform = "ai_platform.bundle.cli:main"

[project.urls]
Homepage = "https://github.com/sepoul/ai-platform"
Repository = "https://github.com/sepoul/ai-platform"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
