name: Build & push images

# Builds both monorepo images (mathapp backend + math-ui frontend)
# and pushes them to GHCR.
#
# Triggers:
#   - push to main          → tags :latest and :sha-<short>
#   - manual workflow run   → same tags, lets you rebuild without a commit
#
# Both images share the same short-SHA tag for every run, so a single
# IMAGE_TAG env var can pin both back-end and front-end to the same
# commit when redeploying. Pull on the box with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
# See infra/hetzner/scripts/redeploy.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Control plane (FastAPI; NO engine) — control/execution split phase 3b.
          - name: aiplatform-api
            context: .
            file: Dockerfile.api
            image: ghcr.io/sepoul/aiplatform-api
            build-args: ""
          # Default execution runtime (pydantic_ai + Anthropic + Logfire).
          - name: aiplatform-worker
            context: .
            file: Dockerfile.worker
            image: ghcr.io/sepoul/aiplatform-worker
            build-args: |
              EXTRA=default
          # CrewAI execution runtime (multi-agent panel, otel <1.35, no Logfire SDK).
          - name: aiplatform-worker-crewai
            context: .
            file: Dockerfile.worker
            image: ghcr.io/sepoul/aiplatform-worker-crewai
            build-args: |
              EXTRA=crewai
          - name: math-ui
            context: math-ui
            file: ""
            image: ghcr.io/sepoul/math-ui
            build-args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
