name: Build & push image

# Builds the mathapp container and pushes it to GHCR.
#
# Triggers:
#   - push to main          → tags :latest and :sha-<short>
#   - manual workflow run   → same tags, lets you rebuild without a commit
#
# Pull on the box with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
# See infra/hetzner/scripts/redeploy.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sepoul/mathapp:latest
            ghcr.io/sepoul/mathapp:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
