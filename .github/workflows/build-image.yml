name: Build & push images

# Builds the platform-tier images first, then chains domain-bound
# worker images on top.
#
# Two jobs:
#   build-platform  — `aiplatform-api`, `aiplatform-worker` (virgin),
#                     `math-ui`. The worker image has NO domain code.
#   build-domain    — `aiplatform-worker-mathqa`,
#                     `aiplatform-worker-mathconversation`. Each builds
#                     a wheel from packages/<domain>/ and installs it
#                     on top of the just-published aiplatform-worker
#                     (Dockerfile.worker-domain).
#
# Triggers:
#   - push to main          → tags :latest and :sha-<short>
#   - manual workflow run   → same tags
#
# Pull on the box with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
# See infra/hetzner/scripts/redeploy.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-platform:
    runs-on: ubuntu-latest
    outputs:
      sha-short: ${{ steps.sha.outputs.short }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Control plane (FastAPI; NO engine).
          - name: aiplatform-api
            context: .
            file: Dockerfile.api
            image: ghcr.io/sepoul/aiplatform-api
            build-args: ""
          # Virgin execution-plane image: platform-only, no domain
          # source. Domain-bound workers chain on top of it.
          - name: aiplatform-worker
            context: .
            file: Dockerfile.worker
            image: ghcr.io/sepoul/aiplatform-worker
            build-args: ""
          # math-ui now consumes @aiplatform/sdk (file:../sdk-ts), so
          # the build context is REPO ROOT (not math-ui/) — same shape
          # as platform-ui below.
          - name: math-ui
            context: .
            file: math-ui/Dockerfile
            image: ghcr.io/sepoul/math-ui
            build-args: ""
          # Domain-free admin SPA (catalog browser). Built from
          # platform-ui/Dockerfile; listens on 7861 in prod compose.
          # Context is REPO ROOT (not platform-ui/) because the image
          # also needs sibling sdk-ts/ to build the in-repo TypeScript
          # SDK that platform-ui consumes.
          - name: platform-ui
            context: .
            file: platform-ui/Dockerfile
            image: ghcr.io/sepoul/platform-ui
            build-args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # NOTE: the `build-domain` job that produced
  # `aiplatform-worker-mathqa` / `-mathconversation` images is retired.
  # Domain wheels arrive at runtime via the CodePackage catalog
  # (`aiplatform deploy …`), not at image-build time. The virgin
  # `aiplatform-worker` image built above is what runs in prod for
  # every runtime. See docs/architecture.md §6.
