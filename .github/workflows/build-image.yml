name: Build & push images

# Builds the platform-tier images first, then chains domain-bound
# worker images on top.
#
# Two jobs:
#   build-platform  — `aiplatform-api`, `aiplatform-worker` (virgin),
#                     `math-ui`. The worker image has NO domain code.
#   build-domain    — `aiplatform-worker-mathqa`,
#                     `aiplatform-worker-mathconversation`. Each builds
#                     a wheel from packages/<domain>/ and installs it
#                     on top of the just-published aiplatform-worker
#                     (Dockerfile.worker-domain).
#
# Triggers:
#   - push to main          → tags :latest and :sha-<short>
#   - manual workflow run   → same tags
#
# Pull on the box with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
# See infra/hetzner/scripts/redeploy.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-platform:
    runs-on: ubuntu-latest
    outputs:
      sha-short: ${{ steps.sha.outputs.short }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Control plane (FastAPI; NO engine).
          - name: aiplatform-api
            context: .
            file: Dockerfile.api
            image: ghcr.io/sepoul/aiplatform-api
            build-args: ""
          # Virgin execution-plane image: platform-only, no domain
          # source. Domain-bound workers chain on top of it.
          - name: aiplatform-worker
            context: .
            file: Dockerfile.worker
            image: ghcr.io/sepoul/aiplatform-worker
            build-args: ""
          - name: math-ui
            context: math-ui
            file: ""
            image: ghcr.io/sepoul/math-ui
            build-args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  build-domain:
    needs: build-platform
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # math_qa domain — default runtime stack (pydantic_ai +
          # Anthropic + Logfire). Built FROM aiplatform-worker:<sha>.
          - name: aiplatform-worker-mathqa
            image: ghcr.io/sepoul/aiplatform-worker-mathqa
            domain: math-qa
          # math_conversation domain — crewai runtime stack.
          - name: aiplatform-worker-mathconversation
            image: ghcr.io/sepoul/aiplatform-worker-mathconversation
            domain: math-conversation
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker-domain
          # Pin the platform image by SHA from the matrix run that just
          # finished. Guarantees both ends of the dep tree are from the
          # same commit even if `:latest` races a subsequent build.
          build-args: |
            DOMAIN=${{ matrix.domain }}
            PLATFORM_IMAGE=ghcr.io/sepoul/aiplatform-worker:sha-${{ needs.build-platform.outputs.sha-short }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ needs.build-platform.outputs.sha-short }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
