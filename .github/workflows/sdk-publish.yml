name: Publish SDK to npm

# Publishes @sepoul-packages/sdk to npmjs.com on a `sdk-v*` tag, so consumers
# (platform-ui here, math-app/math-ui) depend on a real versioned package
# instead of a local `file:` path. Auth is **npm Trusted Publishing
# (OIDC)** — no long-lived NPM_TOKEN secret; provenance is attached
# automatically.
#
# ── One-time npm setup ────────────────────────────────────────────────
#   On npmjs.com, add a Trusted Publisher to the `@sepoul-packages/sdk`
#   package (Settings → Trusted Publisher):
#     Publisher:  GitHub Actions
#     Repository: sepoul/ai-platform
#     Workflow:   sdk-publish.yml
#   Docs: https://docs.npmjs.com/trusted-publishers
#   First-publish bootstrap: if npm requires the package to exist before
#   you can add a trusted publisher, do ONE manual `npm publish` (logged
#   in locally) to create @sepoul-packages/sdk@0.1.1, then enable the
#   trusted publisher for every release after that.
#
# ── Cut a release ─────────────────────────────────────────────────────
#   - bump `sdk-ts/package.json` "version" (e.g. 0.1.2), commit to main
#   - git tag sdk-v0.1.2 && git push origin sdk-v0.1.2
#   The tag must match the package.json version (guarded below).

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC — required for npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk-ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing + automatic provenance need npm >= 11.5.1;
      # setup-node's bundled npm is older, so upgrade.
      - run: npm install -g npm@latest

      - name: Tag must match package.json version
        if: github.event_name == 'push'
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#sdk-v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag sdk-v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing @sepoul-packages/sdk@$PKG"

      - run: npm ci
      - run: npm run build
      # OIDC handles auth (no NODE_AUTH_TOKEN); `access: public` +
      # provenance come from package.json publishConfig / the OIDC flow.
      - run: npm publish
