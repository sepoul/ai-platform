# Local-dev compose: API + worker as two long-running services backed by a
# shared volume for the local job repo / artifacts. This is the canonical
# way to run the stack for now — there is no production deployment story yet.
#
# COMPUTE MODE = which profile is active (mutually exclusive — the two
# never run together, so the poll loop and the celery consumer can't race
# for the same jobs):
#
#   poll  (default)  → `worker` (+ optional `worker-crewai`) SELECT-poll the
#                      repo. Active when COMPOSE_PROFILES=poll — `.env.example`
#                      ships that, so a plain `docker compose up` stays on poll.
#   celery           → `redis` + `celery-worker`; the API enqueues to the
#                      broker and the worker picks up immediately. No poll
#                      worker runs. One command (it pins the profile + COMPUTE
#                      so `.env` can't leak the poll worker back in):
#                          scripts/compose-celery.sh up -d
#                      See docs/operations/hetzner-deploy.md §6.
#
# Usage:
#   docker compose up --build           # first run / after deps change (poll)
#   docker compose up -d                # subsequent runs (poll; needs COMPOSE_PROFILES=poll)
#   docker compose logs -f worker       # tail one service
#   COMPOSE_PROFILES=poll,crewai docker compose up -d   # poll + the crewai pool
#   scripts/compose-celery.sh up -d     # celery mode (redis + celery-worker, NO poll)
#   scripts/compose-celery.sh down      # tear the celery stack down
#
# Note: `worker` now lives behind the `poll` profile, so if your `.env`
# predates this and lacks `COMPOSE_PROFILES`, add `COMPOSE_PROFILES=poll`
# (or pass `--profile poll`) or the worker won't start.
#
# The API is published at http://localhost:8000 so a Next.js dev server
# running on the host can call it directly. The worker has no port — it
# polls jobs off the shared `data` volume.
#
# Default backend is `local` (filesystem-backed). Other supported
# backends — wire the required vars in `.env`, see `.env.example`:
#   BACKEND=b2        → B2_KEY_ID / B2_APP_KEY / B2_BUCKET
#   BACKEND=supabase  → SUPABASE_URL / SUPABASE_SECRET_KEY /
#                       SUPABASE_BUCKET / SUPABASE_CONNECTION_STRING

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api   # control plane: core + FastAPI, NO engine
    image: aiplatform-api:local
    command: >
      python -u -m uvicorn ai_platform.entrypoints.api:app
      --host 0.0.0.0
      --port 8000
    environment:
      BACKEND: ${BACKEND:-local}
      LOCAL_DATA_DIR: /data
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APP_KEY: ${B2_APP_KEY:-}
      B2_BUCKET: ${B2_BUCKET:-app-data}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-app-data}
      # Postgres schema scope. Empty → `public` (PROD/Hetzner). Local dev
      # sets `test` (+ SUPABASE_BUCKET=app-data-test) for an isolated clone.
      SUPABASE_SCHEMA: ${SUPABASE_SCHEMA:-}
      SUPABASE_CONNECTION_STRING: ${SUPABASE_CONNECTION_STRING:-}
      # Compute selection + broker URL. Both no-ops when COMPUTE=poll
      # (the default); read only by `CeleryComputeBackend.enqueue` when
      # COMPUTE=celery.
      COMPUTE: ${COMPUTE:-poll}
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - mathapp-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  # Virgin platform worker — build-only service. Build with:
  #   docker compose --profile build build aiplatform-worker
  # before bringing up `worker` / `worker-crewai`, because those build
  # FROM this image. Production pulls the equivalent GHCR image at
  # deploy time and never builds locally.
  aiplatform-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: aiplatform-worker:local
    profiles: [build]
    command: ["true"]   # not meant to run; the image is the artifact

  worker:
    # Default-runtime poll worker. Ships `_demo` as the baseline domain so
    # local-dev `docker compose up` has at least one registerable job
    # without a deploy. Real domains (math-app etc.) arrive at runtime
    # via the CodePackage catalog.
    #
    # Behind the `poll` profile so celery mode (COMPOSE_PROFILES=celery)
    # can exclude it — a non-profiled service can't be excluded, and an
    # always-on poll worker would race the celery consumer. `.env.example`
    # ships COMPOSE_PROFILES=poll so the default `docker compose up` still
    # brings it up.
    profiles: [poll]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: aiplatform-worker:local
    command: >
      python -u -m ai_platform.entrypoints.worker
      --interval ${WORKER_INTERVAL:-5}
    environment:
      BACKEND: ${BACKEND:-local}
      LOCAL_DATA_DIR: /data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OpenAI provider helpers (audio transcription, openai_agent). SDK is in
      # the worker base; this key lets it call out. Empty is fine until a
      # domain actually invokes an OpenAI helper.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APP_KEY: ${B2_APP_KEY:-}
      B2_BUCKET: ${B2_BUCKET:-app-data}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-app-data}
      # Postgres schema scope. Empty → `public` (PROD/Hetzner). Local dev
      # sets `test` (+ SUPABASE_BUCKET=app-data-test) for an isolated clone.
      SUPABASE_SCHEMA: ${SUPABASE_SCHEMA:-}
      SUPABASE_CONNECTION_STRING: ${SUPABASE_CONNECTION_STRING:-}
      WORKER_MAX_JOB_AGE_S: ${WORKER_MAX_JOB_AGE_S:-}
      # Reclaim a RUNNING job whose worker died mid-job (no heartbeat for
      # this many seconds) → PENDING for re-claim. Empty → reaper off.
      WORKER_JOB_LEASE_TTL_S: ${WORKER_JOB_LEASE_TTL_S:-}
      # Worker → API live-log POST target. Compose-internal DNS;
      # falls back to the in-process default for non-compose dev.
      PLATFORM_API_URL: ${PLATFORM_API_URL:-http://api:8000}
      # Worker → math-ui validate-latex tool. Resolves to the math-ui
      # container when the `ui` profile is up; otherwise the validator
      # call fails — fine, validate-latex is best-effort.
      UI_TOOL_API_URL: ${UI_TOOL_API_URL:-http://math-ui:7860}
    volumes:
      - mathapp-data:/data
    depends_on:
      - api
    restart: unless-stopped

  # crewai runtime worker pool. Same virgin worker image as the
  # `worker` service above — there is no longer a crewai-specific
  # base because no real crewai domain ships in this repo. The
  # `WORKER_RUNTIME=crewai` env scopes the worker to that runtime's
  # CodePackage catalog rows (a friend's crewai domain installs at
  # boot via the catalog).
  #
  # Also a poll worker, kept on its own `crewai` profile so it stays
  # opt-in. To run it next to the default poll worker locally, enable
  # both: `COMPOSE_PROFILES=poll,crewai docker compose up -d`.
  worker-crewai:
    image: aiplatform-worker:local
    command: >
      python -u -m ai_platform.entrypoints.worker
      --interval ${WORKER_INTERVAL:-5}
    environment:
      WORKER_RUNTIME: crewai
      BACKEND: ${BACKEND:-local}
      LOCAL_DATA_DIR: /data
      # Crew runs on Anthropic via CrewAI's native provider. anthropic SDK
      # comes from `crewai[anthropic]` (this image is isolated from the
      # default runtime, so no SDK-version clash with pydantic-ai-slim).
      # No LOGFIRE_TOKEN — this runtime can't load the Logfire SDK (otel
      # pin); OTLP export to Logfire is a follow-up.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OpenAI provider helpers (audio transcription, openai_agent). SDK is in
      # the worker base; this key lets it call out. Empty is fine until a
      # domain actually invokes an OpenAI helper.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APP_KEY: ${B2_APP_KEY:-}
      B2_BUCKET: ${B2_BUCKET:-app-data}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-app-data}
      # Postgres schema scope. Empty → `public` (PROD/Hetzner). Local dev
      # sets `test` (+ SUPABASE_BUCKET=app-data-test) for an isolated clone.
      SUPABASE_SCHEMA: ${SUPABASE_SCHEMA:-}
      SUPABASE_CONNECTION_STRING: ${SUPABASE_CONNECTION_STRING:-}
      WORKER_MAX_JOB_AGE_S: ${WORKER_MAX_JOB_AGE_S:-}
      # Reclaim a RUNNING job whose worker died mid-job (no heartbeat for
      # this many seconds) → PENDING for re-claim. Empty → reaper off.
      WORKER_JOB_LEASE_TTL_S: ${WORKER_JOB_LEASE_TTL_S:-}
      PLATFORM_API_URL: ${PLATFORM_API_URL:-http://api:8000}
      UI_TOOL_API_URL: ${UI_TOOL_API_URL:-http://math-ui:7860}
    volumes:
      - mathapp-data:/data
    depends_on:
      - api
    restart: unless-stopped
    profiles: [crewai]

  # Celery profile: redis broker + one celery consumer PER RUNTIME
  # (issue #66). The split mirrors the poll `worker` / `worker-crewai`
  # topology: `celery-worker` (WORKER_RUNTIME=default) and
  # `celery-worker-crewai` (WORKER_RUNTIME=crewai) each register only
  # their runtime's domains and consume only their runtime's queue
  # (`runtime.<WORKER_RUNTIME>`); the API routes each job to the matching
  # queue. All three sit behind the `celery` profile, started under
  # COMPOSE_PROFILES=celery — which `scripts/compose-celery.sh` pins, so
  # the poll `worker`/`worker-crewai` (behind `poll`/`crewai`) stay down
  # and can't race the consumers — no manual `stop worker` needed. See
  # docs/operations/hetzner-deploy.md §6 for the full recipe.
  redis:
    image: redis:7-alpine
    # AOF on so queued jobs survive a redis restart. fsync-every-sec is
    # the sane default: durability lag bounded to ~1s, no I/O storm.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    # Gate `celery-worker` on this so it doesn't boot and start retrying
    # before the broker is actually accepting connections.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: unless-stopped
    profiles: [celery]

  # Default-runtime celery consumer (pydantic_ai: math_qa, math_notes).
  # Uses the virgin aiplatform-worker image (with the `_demo` baseline
  # domain installed); real domains arrive via the catalog install pass on
  # boot. WORKER_RUNTIME scopes which domains it registers AND which queue
  # it consumes — see celery_app.py.
  celery-worker:
    image: aiplatform-worker:local
    command: >
      celery -A ai_platform.entrypoints.celery_app worker
      --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-2}
    environment:
      WORKER_RUNTIME: default
      BACKEND: ${BACKEND:-local}
      LOCAL_DATA_DIR: /data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OpenAI provider helpers (audio transcription, openai_agent). SDK is in
      # the worker base; this key lets it call out. Empty is fine until a
      # domain actually invokes an OpenAI helper.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APP_KEY: ${B2_APP_KEY:-}
      B2_BUCKET: ${B2_BUCKET:-app-data}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-app-data}
      # Postgres schema scope. Empty → `public` (PROD/Hetzner). Local dev
      # sets `test` (+ SUPABASE_BUCKET=app-data-test) for an isolated clone.
      SUPABASE_SCHEMA: ${SUPABASE_SCHEMA:-}
      SUPABASE_CONNECTION_STRING: ${SUPABASE_CONNECTION_STRING:-}
      CELERY_BROKER_URL: redis://redis:6379/0
      PLATFORM_API_URL: ${PLATFORM_API_URL:-http://api:8000}
      UI_TOOL_API_URL: ${UI_TOOL_API_URL:-http://math-ui:7860}
    volumes:
      - mathapp-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: [celery]

  # crewai-runtime celery consumer (CrewAI: math_conversation). Same image,
  # WORKER_RUNTIME=crewai → registers only crewai domains and consumes only
  # the `runtime.crewai` queue. No LOGFIRE_TOKEN: this runtime can't load the
  # Logfire SDK (otel-sdk pin), mirroring `worker-crewai`. Comes up with the
  # default and crewai consumers together under `--profile celery`, matching
  # prod (both runtimes served).
  celery-worker-crewai:
    image: aiplatform-worker:local
    command: >
      celery -A ai_platform.entrypoints.celery_app worker
      --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-2}
    environment:
      WORKER_RUNTIME: crewai
      BACKEND: ${BACKEND:-local}
      LOCAL_DATA_DIR: /data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APP_KEY: ${B2_APP_KEY:-}
      B2_BUCKET: ${B2_BUCKET:-app-data}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-app-data}
      # Postgres schema scope. Empty → `public` (PROD/Hetzner). Local dev
      # sets `test` (+ SUPABASE_BUCKET=app-data-test) for an isolated clone.
      SUPABASE_SCHEMA: ${SUPABASE_SCHEMA:-}
      SUPABASE_CONNECTION_STRING: ${SUPABASE_CONNECTION_STRING:-}
      CELERY_BROKER_URL: redis://redis:6379/0
      PLATFORM_API_URL: ${PLATFORM_API_URL:-http://api:8000}
      UI_TOOL_API_URL: ${UI_TOOL_API_URL:-http://math-ui:7860}
    volumes:
      - mathapp-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: [celery]

volumes:
  # Named volume keeps job repo + math_qa artifacts across runs.
  # To reuse the on-host `./mathdata` instead, replace with:
  #   - ./mathdata:/data
  # under each service and drop this `volumes:` block.
  mathapp-data:
  redis-data:
